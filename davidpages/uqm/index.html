<body>

    <a href="/davidpages/index.html">Back to Room</a><br>

    <div id="view-options">
        <!-- size -->
        <div id="size-options">
            <img class="emoji" style="margin-bottom:5px; align-self:center;" src="/davidpages/emoji/magnifying-glass.gif">
            <label class="option"><input type="radio" name="size" id="1x" value="1" checked><span>1x</span></label>
            <label class="option"><input type="radio" name="size" id="2x" value="2">2x</label>
            <label class="option"><input type="radio" name="size" id="3x" value="3">3x</label>
            <label class="option"><input type="radio" name="size" id="4x" value="4">4x</label>
            <label class="option"><input type="radio" name="size" id="5x" value="5">5x</label>
        </div>

        <!-- sort by -->
         <div id="sort-by-options">
            <span>Sort by:</span>
            <label class="option"><input type="radio" name="sort-by" id="name" value="nameOrder" checked>Alphabetical</label>
            <label class="option"><input type="radio" name="sort-by" id="crew" value="crew">Crew</label>
            <label class="option"><input type="radio" name="sort-by" id="batt" value="batt">Battery</label>
            <label class="option"><input type="radio" name="sort-by" id="point-value" value="score">Point Value</label>
         </div>

        <!-- order -->
         <div id="order-options">
            <span>Order:</span>
            <label class="option"><input type="radio" name="order" id="option1" value="ascending" checked>Ascending</label>
            <label class="option"><input type="radio" name="order" id="option2" value="descending">Descending</label>
         </div>
    </div>
