<script>
  // 1. Set the range of your numbered files
  const MIN_NUMBER = 1;
  const MAX_NUMBER = 4; // Change this to your total number of files

  // 2. Generate a random integer between MIN and MAX (inclusive)
  const randomNumber = Math.floor(Math.random() * (MAX_NUMBER - MIN_NUMBER + 1)) + MIN_NUMBER;

  // update tab name to match
  document.title = "VOL-RADIO-" + randomNumber;

  // 3. Build the path to the audio file
  const audioPath = `https://davidsroom.org/vol-radio/vol-radio-${randomNumber}.wav`;

  // 4. Get element
  const audioElement = document.getElementById('radioAudio');

  // 5. Attach listener FIRST so we don't miss the event
  audioElement.addEventListener('loadedmetadata', () => {
    if (audioElement.duration && !isNaN(audioElement.duration)) {
      audioElement.currentTime = Math.random() * audioElement.duration;
    }
  });

  // 6. Set source & start loading
  audioElement.src = audioPath;
  audioElement.load();
</script>
