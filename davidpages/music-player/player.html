<!DOCTYPE html>
<head>
  <title>VOL RADIO</title>
    <link rel="icon" type="image/x-icon" href="/davidpages/emoji/radio.gif">
  <link rel="stylesheet" href="/davidpages/style.css">
  <style>
    body {
      background-color: lightgreen;
      /* border: 3px solid darkcyan; */
    }

    @layer special {
      img {
        all: revert;

        width: 50px;
        display: block;
        justify-self: center;

        margin: 25px;

        filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5));
      }
    }

    audio {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <img src="/davidpages/emoji/radio.gif">
  <audio id="radioAudio" controls autoplay loop>
      <source src="/davidpages/music/soundtrack.wav" type="audio/wav">
      <!--<source src="/davidpages/music/potential-energy/borzo.wav" type="audio/wav">-->
      Your browser does not support the audio element.
  </audio>

  <!-- start at random point -->
   <!-- thanks ai <3 -->
  <script>
    const audio = document.getElementById('radioAudio');

    audio.addEventListener('loadedmetadata', () => {
      if (audio.duration) {
        audio.currentTime = Math.random() * audio.duration;
      }
    });
  </script>

</body>
