<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photos</title>
  <link rel="icon" type="image/x-icon" href="/davidpages/vol.ico">
  <link rel="stylesheet" href="/davidpages/style.css">
  <link href="https://api.fontshare.com/v2/css?f[]=zodiak@100,101,300,301,400,401,700,701,800,801,900,901,1,2&display=swap" rel="stylesheet">
</head>
<body>

<div class="card-container">

<figure>
  <img class="photo" src="img/silhouetted-tree-leaves.JPG" alt="silhouetted tree leaves">
  <figcaption>Against the sky, leaves sometimes lose all color and merge into one complex abstract boundary</figcaption>
</figure>

<figure>
  <img class="photo" src="img/graffiti-tunnel.jpg" alt="graffiti tunnel">
  <figcaption>The greatest photo I've ever taken</figcaption>
</figure>

<figure>
  <img class="photo" src="img/yellow-moon-dusk.jpg" alt="yellow moon at dusk">
  <figcaption>O how smartphones attempt to capture the majesty of the moon and the pale gradients of dusk</figcaption>
</figure>

<figure>
  <img class="photo" src="img/cirrus-over-trees.jpg" alt="grand cirrus clouds over some trees">
  <figcaption>Streaked cirrus...</figcaption>
</figure>

<figure>
  <img class="photo" src="img/mall-roof.jpg" alt="mall roof with evil Target logo glowing in the background">
  <figcaption>Mall roof is a strange place</figcaption>
</figure>

<figure>
  <img class="photo" src="img/moon-and-palms.jpg" alt="moon and palm trees">
  <figcaption>Luna playing amid the palms</figcaption>
</figure>

<figure>
  <img class="photo" src="img/beach-clouds.jpg" alt="striking gray clouds on the beach">
  <figcaption>Sometimes there is little color, but a staggering variety of texture and shading in the clouds</figcaption>
</figure>

<figure>
  <img class="photo" src="img/dusk-gradient-trees.jpg" alt="dusk rainbow gradient behind some trees">
  <figcaption>The gradient of sunset is often a full rainbow</figcaption>
</figure>

<figure>
  <img class="photo" src="img/you-are-being-watched.jpg" alt="graffiti eye over 'you are being watched' sign">
  <figcaption>You are being watched</figcaption>
</figure>

<figure>
  <img class="photo" src="img/ladder-in-darkness.jpg" alt="ladder in darkness">
  <figcaption>...</figcaption>
</figure>

<figure>
  <img class="photo" src="img/you-know-what-i-like-about-you.jpg" alt="you know what I like about you?">
  <figcaption>Found in an emptied-out office</figcaption>
</figure>

<figure>
  <img class="photo" src="img/telephone-pole.jpg" alt="telephone pole">
  <figcaption>Our network of towers that propagate the invisible energy that powers everything</figcaption>
</figure>

<figure>
  <img class="photo" src="img/live-the-life-you-love.jpg" alt="telephone pole">
  <figcaption>♥</figcaption>
</figure>

<figure>
  <img class="photo" src="img/autumn-hillside.jpg" alt="autumn hillside">
  <figcaption>Like Christian crosses littered about</figcaption>
</figure>

<figure>
  <img class="photo" src="img/gingko-leaves-with-dew.jpg" alt="autumn hillside">
  <figcaption>Ginkgo is one of those "living fossils" apparently</figcaption>
</figure>

<figure>
  <img class="photo" src="img/wet-leaf.jpg" alt="wet leaf on the ground">
  <figcaption>Wetness accentuates texture</figcaption>
</figure>
