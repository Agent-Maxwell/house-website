<p>
    In <a href="/davidpages/cards/games.html#hearts">Hearts</a>, the Q♠ is known as the "Black Lady," and is worth 13 points; as much as all the hearts combined. <span class="note"><a href="/paulpages/paulsroom.html">Paul</a> appropriately referred to her as the "nuclear bomb."</span>
</p>

<p>
    Like all spade royals, The Q♠ faces away from her suit pip.
</p>
