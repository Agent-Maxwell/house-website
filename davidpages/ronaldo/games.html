        .games-container {

            margin: 20px;
            /* width: calc((100% - (20px * 7)) / 6); */
            width: 100%;
        }
        .game img {
            width:100%;
            border: 4px solid lime;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .game:hover img {
            transform: translate(0, -10px);
            border: 4px solid gold;
            box-shadow: 0px 10px 10px rgba(0,0,0,0.5);
        }
        .game:active img {
            border: 4px solid white;
        }
    </style>
